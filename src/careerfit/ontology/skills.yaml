
# ambiguous: true when the word's non-skill meaning is common in resumes/JDs
# (e.g. "go live", "a swift turnaround"), so a keyword match alone can't be trusted.
# aliases must never be ambiguous; an ambiguous spelling doesn't belong in aliases.
# implies: broader skills this one shows by definition ("pl/sql" is SQL and back-end development).
# A resume that names it clearly then matches a JD asking for the broader skill, cited to that line.
# Only strict "X is a kind of Y" facts; never "people who know X usually know Y".

python:
  aliases: ["python3"]
  ambiguous: false

kubernetes:
  aliases: ["k8s", "kube"]
  ambiguous: false

aws:
  aliases: ["amazon web services"]
  ambiguous: false
  implies: [cloud computing]  # AWS is a cloud platform, by definition

java:
  aliases: []
  ambiguous: false

javascript:
  aliases: ["js"]
  ambiguous: false

django:
  aliases: []
  ambiguous: false
  implies: [python, backend development]

go:
  aliases: ["golang"]
  ambiguous: true

swift:
  aliases: []
  ambiguous: true

r:
  aliases: []
  ambiguous: true

docker:
  aliases: []
  ambiguous: false

terraform:
