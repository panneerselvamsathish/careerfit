# Hand-written corrections for scripts/import_taxonomy.py. Edit this, then regenerate
# skills_imported.yaml; never edit the generated file itself.
#
# keep:        one-word names that are everyday words but really are tools in job descriptions.
#              Kept only if the rest of the rules allow them.
# drop:        imported names that are too generic or wrong (after cleaning, lowercase).
# rename:      a cleaned name that should read differently: {from: to}.
# alias_allow: extra aliases for an imported skill that the rules would reject: {skill: [aliases]}.
# implies:     curated skills an imported one shows by definition: {skill: [curated skills]}. Only strict
#              "X is a kind of Y" facts, as in skills.yaml: a curated name inside an imported one
#              ("SQL" in "Transact-SQL") is hidden as its own mention, so only this brings it back.

keep: []
# Proposed 2026-10-19 by claude after the Copilot review on #31, confirmed by sathish the same day: imported names that are a curated skill
# in other words. As their own skills, a JD saying "Jenkins CI" would also demand "jenkins ci", and a
# resume saying "Jenkins" would get a false gap. "javascript framework" is generic, not a tool.
drop:
  - agile development
  - agile project management
  - amazon simple storage service s3
  - javascript framework
  - jenkins ci
  - microservices architecture
  - oracle relational database   # curated "oracle database"; proposed 2026-10-20 by claude, not yet confirmed by sathish
  - relational database management
  - restful api
  - simple storage service s3
  - single sign-on sso
  - sun microsystems java
  - waterfall development
# Proposed 2026-10-19 by claude after the Copilot review on #31, not yet confirmed by sathish: one tool
# under two names. As two skills, a JD asking for "SQL Server Integration Services (SSIS)" demanded
# both, and a resume saying "SSIS" got a false gap. Active Directory and Visual Basic are products
# whose vendor-free names are everyday words, so the automatic vendor merge leaves them apart.
rename:
  microsoft active directory: active directory
  microsoft ssis: sql server integration services
  microsoft visual basic: visual basic
alias_allow: {}
# Proposed 2026-10-20 by claude after the Copilot review on #31, not yet confirmed by sathish: the 41
# imported names that contain a curated one (IMPORT_MANIFEST review: contains_a_curated_term). These 23
# are a kind of that skill: a dialect, a library or runtime, a service of that platform, a product of
# that category. Without it, "Wrote Transact-SQL procedures" left SQL a gap.
implies:
  adeptia etl suite: [etl]
  amazon data pipeline: [data pipelines]
  backbone.js: [javascript]
  citrix cloud computing: [cloud computing]
  core banking software: [banking]
  ext js: [javascript]
  ibm qradar siem: [siem]
  ibm racf: [access control]
  information security strategy: [cybersecurity]
  microsoft azure data factory: [azure]
  microsoft azure devops services: [devops]          # a DevOps platform; not Azure cloud experience
  microsoft azure sentinel: [azure, siem]
  node.js: [javascript]
  oracle java ee: [java]
  oracle jms: [java]
  react native: [react]
  react redux: [react]
  sun microsystems java persistence api: [java]
  sun microsystems java servlet api: [java]
  transact-sql: [sql]
  vue.js: [javascript]
  websense data loss prevention: [dlp]
  xerces2 java parser: [java]
# Left out on purpose (the nested name stays hidden), same proposal:
#   aurora helioscope (solar design software, not Amazon Aurora); javascript object notation json (a data
#   format, not JavaScript); micosoft ssas, microsoft ssrs, sql server integration services, redgate sql
#   server (SQL Server tools, as SSIS shows no SQL Server); cast sql builder, oracle sql developer, oracle
#   sql loader, oracle sql plus, quest sql optimizer for oracle, sentryone sql sentry, yourkit java
#   profiler, endeavour agile alm (tools used with a skill, not the skill); nortonlifelock cybersecurity
#   (a consumer product); openai chatgpt (using ChatGPT isn't the OpenAI API); qualys cloud platform (a
#   security service, not cloud computing); event-driven state-machines programming (a programming style,
#   not event-driven architecture).
