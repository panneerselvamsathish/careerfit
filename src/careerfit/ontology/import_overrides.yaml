# Hand-written corrections for scripts/import_taxonomy.py. Edit this, then regenerate
# skills_imported.yaml; never edit the generated file itself.
#
# keep:        one-word names that are everyday words but really are tools in job descriptions.
#              Kept only if the rest of the rules allow them.
# drop:        imported names that are too generic or wrong (after cleaning, lowercase).
# rename:      a cleaned name that should read differently: {from: to}.
# alias_allow: extra aliases for an imported skill that the rules would reject: {skill: [aliases]}.

keep: []
# Proposed 2026-10-19 by claude after the Copilot review on #31, confirmed by sathish the same day: imported names that are a curated skill
# in other words. As their own skills, a JD saying "Jenkins CI" would also demand "jenkins ci", and a
# resume saying "Jenkins" would get a false gap. "javascript framework" is generic, not a tool.
drop:
  - agile development
  - agile project management
  - amazon simple storage service s3
  - javascript framework
  - jenkins ci
  - microservices architecture
  - relational database management
  - restful api
  - simple storage service s3
  - single sign-on sso
  - sun microsystems java
  - waterfall development
# Proposed 2026-10-19 by claude after the Copilot review on #31, not yet confirmed by sathish: one tool
# under two names. As two skills, a JD asking for "SQL Server Integration Services (SSIS)" demanded
# both, and a resume saying "SSIS" got a false gap. Active Directory and Visual Basic are products
# whose vendor-free names are everyday words, so the automatic vendor merge leaves them apart.
rename:
  microsoft active directory: active directory
  microsoft ssis: sql server integration services
  microsoft visual basic: visual basic
alias_allow: {}
