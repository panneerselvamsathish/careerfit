[project]
name = "careerfit"
version = "0.1.0"
description = "Application to provide if the applicant is a fit and what is the gap in resume"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=1.6,<2",  # fallbacks + output_config; 1.6.0 is the version tested live
    "pypdf>=4.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "boto3>=1.35",  # DynamoDB: usage events, skill stats, the waitlist, donated JDs (store.py only)
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.26",
    "fpdf2>=2.8.8",
    "botocore[crt]>=1.43.114",  # the usage report signs in with `aws login`, whose credentials need awscrt
]

[project.scripts]
careerfit = "careerfit.cli:main"
careerfit-server = "careerfit.api:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
