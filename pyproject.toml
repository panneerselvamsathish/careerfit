[project]
name = "careerfit"
version = "0.1.0"
description = "Application to provide if the applicant is a fit and what is the gap in resume"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6"
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.26"
]

[project.scripts]
careerfit = "careerfit.cli:main"
careerfit-server = "careerfit.api:run"

[tool.pytest.ini_options]
testpaths = ["tests"]